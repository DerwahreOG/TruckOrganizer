name: Build Thunderstore package

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build and pack
        run: ./pack.sh

      # The artifact is uploaded as loose files on purpose: GitHub wraps
      # artifacts in a zip on download, so the downloaded zip itself becomes
      # a valid Thunderstore package (manifest.json etc. at the root).
      - name: Unpack for artifact upload
        run: mkdir -p dist/pkg && unzip -o dist/TruckOrganizer-*.zip -d dist/pkg

      - name: Upload Thunderstore package
        uses: actions/upload-artifact@v4
        with:
          name: TruckOrganizer-thunderstore-upload-me
          path: dist/pkg
          if-no-files-found: error
